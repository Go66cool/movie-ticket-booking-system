spring:
  application:
    name: movie-booking
  datasource:
    url: jdbc:h2:mem:booking;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

app:
  security:
    jwt:
      secret: change-me-please-this-is-a-dev-only-secret-key-change-me-please
      ttl-minutes: 720
  hold:
    ttl-seconds: 600
    sweep-interval-ms: 15000
  notifications:
    enabled: true
  seed:
    enabled: true

logging:
  level:
    com.example.booking: INFO
    org.springframework.security: INFO

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:bookingtest;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
  jpa:
    hibernate:
      ddl-auto: create-drop
app:
  hold:
    ttl-seconds: 2
    sweep-interval-ms: 500
  seed:
    enabled: false
